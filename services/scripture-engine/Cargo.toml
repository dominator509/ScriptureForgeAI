[package]
name = "scripture-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.32", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid"] }
pgvector = { version = "0.3", features = ["sqlx"] }

[build-dependencies]
tonic-build = "0.10"
