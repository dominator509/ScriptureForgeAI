# Local development stack only. Production workloads use the Terraform/Kubernetes
# skeleton and inject secrets through AWS Secrets Manager and the CSI driver.
services:
  postgres:
    image: pgvector/pgvector@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: scriptureforge-dev-root
      POSTGRES_DB: scriptureforge
    ports:
      - "5432:5432"
    volumes:
      # Disposable local databases apply every checked-in up migration in order.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scriptureforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform-engine:
    build:
      context: .
      dockerfile: services/platform-engine/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:scriptureforge-dev-root@postgres:5432/scriptureforge?sslmode=disable
      REDIS_URL: redis://redis:6379
      DEPLOYMENT_ENVIRONMENT: development
      JWT_SECRET_KEY: scriptureforge-development-jwt-secret-0123456789
      JOURNAL_SALT_SECRET: scriptureforge-development-journal-salt-0123456789
      MFA_ENCRYPTION_KEY: scriptureforge-development-mfa-key-0123456789
      ALLOWED_WS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      GRPC_ENGINE_ADDRESS: scripture-engine:50051
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scripture-engine:
        condition: service_started

  scripture-engine:
    build:
      context: .
      dockerfile: services/scripture-engine/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:scriptureforge-dev-root@postgres:5432/scriptureforge?sslmode=disable
      DEPLOYMENT_ENVIRONMENT: development
      RUST_ENGINE_BIND_ADDRESS: 0.0.0.0:50051
      RUST_ENGINE_METRICS_ADDRESS: 0.0.0.0:9102
    ports:
      - "50051:50051"
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
