name: Security Pipeline Verification
on:
  push:
    branches: [ "main", "develop", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Continuous Security Execution
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: scriptureforge
          POSTGRES_DB: scriptureforge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scriptureforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          web/package-lock.json
          mobile/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Run Fuzz Testing Matrix
      run: GO_ENV=testing CI=true go test -fuzz=FuzzSanitizeInput -fuzztime=10s ./tests/unit/

    - name: Run Go Tests
      run: GO_ENV=testing CI=true go test ./...

    - name: Apply Postgres Integration Schema
      env:
        PGPASSWORD: scriptureforge
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        psql -h localhost -p 55433 -U postgres -d scriptureforge -v ON_ERROR_STOP=1 -f migrations/000001_init_extensions.up.sql
        psql -h localhost -p 55433 -U postgres -d scriptureforge -v ON_ERROR_STOP=1 -f migrations/000002_core_schema.up.sql

    - name: Run Postgres RLS Integration Tests
      env:
        CI: "false"
        GO_ENV: testing
        DATABASE_URL: postgres://postgres:scriptureforge@localhost:55433/scriptureforge?sslmode=disable
        JWT_SECRET_KEY: ci-test-secret-for-scriptureforge-auth-and-rls
      run: go test ./tests/integration ./internal/ports -count=1 -timeout=90s -v

    - name: Run Local Performance Harness Smoke
      run: go run ./tools/loadtest -self-test -duration=2s -concurrency=8 -min-rps=100 -max-p99=200ms

    - name: Run Local WebSocket Performance Harness Smoke
      run: go run ./tools/loadtest -websocket-self-test -concurrency=4 -ws-events-per-client=3 -min-rps=10 -max-p99=500ms

    - name: Test Production Evidence Probes
      run: go test ./tools/ciprobe ./tools/stagingprobe ./tools/tenantprobe ./tools/rustprobe ./tools/observabilityprobe ./tools/securityprobe ./tools/resilienceprobe ./tools/mobileprobe ./tools/deploymentprobe ./tools/abuseprobe ./tools/zoomprobe ./tools/aiprobe ./tools/loadtest -count=1

    - name: Validate Observability Artifacts
      run: node tools/validate-observability.mjs

    - name: Validate Secret Hygiene
      run: node tools/validate-secret-hygiene.mjs

    - name: Validate Deployment Skeleton
      run: node tools/validate-deployment-skeleton.mjs

    - name: Validate Staging Evidence Manifest
      run: node tools/validate-staging-evidence.mjs

    - name: Validate CI Workflow Gate Coverage
      run: node tools/validate-ci-workflow.mjs

    - name: Test CI Workflow Gate Coverage
      run: node --test tools/validate-ci-workflow.test.mjs

    - name: Test Local Gate Runner
      run: node --test tools/run-local-gates.test.mjs tools/validate-local-gate-report.test.mjs

    - name: Test Staging Evidence Validator
      run: node --test tools/validate-staging-evidence.test.mjs

    - name: Test Production Readiness Claim Verifier
      run: node --test tools/verify-production-readiness.test.mjs

    - name: Test Staging Evidence Recorder
      run: node --test tools/record-staging-evidence.test.mjs

    - name: Test Staging Evidence Bootstrap
      run: node --test tools/bootstrap-staging-evidence.test.mjs

    - name: Test Staging Evidence Gap Reporter
      run: node --test tools/report-staging-evidence-gaps.test.mjs

    - name: Test CI Release Evidence Writer
      run: node --test tools/write-ci-release-evidence.test.mjs

    - name: Validate Security Artifacts
      run: node tools/validate-security-artifacts.mjs

    - name: Validate Dependency Risk Register
      run: node tools/validate-dependency-risk.mjs

    - name: Test Dependency Risk Register Validator
      run: node --test tools/validate-dependency-risk.test.mjs

    - name: Static Security Scan (SAST)
      run: go vet ./...

    - name: Build Web
      working-directory: web
      run: |
        npm ci
        npm audit --audit-level=moderate
        npm run smoke
        npm run typecheck
        npm run build

    - name: Check Mobile
      working-directory: mobile
      run: |
        npm ci
        npm audit --audit-level=high
        npm run smoke
        npm run build:check

    - name: Validate Rust Protobuf Tooling
      run: node tools/verify-rust-protobuf.mjs

    - name: Test Rust Scripture Engine
      working-directory: services/scripture-engine
      run: cargo test

    - name: Validate Terraform
      working-directory: build/terraform
      run: |
        terraform fmt -check
        terraform init -backend=false
        terraform validate

    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    - name: Write CI Release Evidence
      run: node tools/write-ci-release-evidence.mjs --output artifacts/ci-release-evidence.txt

    - name: Validate CI Release Evidence
      run: go run ./tools/ciprobe -run-artifact-file artifacts/ci-release-evidence.txt -commit-sha "$GITHUB_SHA"

    - name: Upload CI Release Evidence
      uses: actions/upload-artifact@v4
      with:
        name: ci-release-evidence
        path: artifacts/ci-release-evidence.txt
        if-no-files-found: error
