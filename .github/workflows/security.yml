name: Security Pipeline Verification
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Continuous Security Execution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up protoc
      uses: arduino/setup-protoc@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Run Fuzz Testing Matrix
      run: GO_ENV=testing CI=true go test -fuzz=FuzzSanitizeInput -fuzztime=10s ./tests/unit/

    - name: Run Go Tests
      run: GO_ENV=testing CI=true go test ./...

    - name: Static Security Scan (SAST)
      run: go vet ./...

    - name: Build Web
      working-directory: web
      run: |
        npm ci
        npm run typecheck
        npm run build

    - name: Test Rust Scripture Engine
      working-directory: services/scripture-engine
      run: cargo test

    - name: Validate Terraform
      working-directory: build/terraform
      run: |
        terraform fmt -check
        terraform init -backend=false
        terraform validate

    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
