name: Security Pipeline Verification
on:
  push:
    branches: [ "main", "develop", "codex/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    name: Continuous Security Execution
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: scriptureforge
          POSTGRES_DB: scriptureforge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scriptureforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          web/package-lock.json
          mobile/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Run Fuzz Testing Matrix
      run: GO_ENV=testing CI=true go test -fuzz=FuzzSanitizeInput -fuzztime=10s ./tests/unit/

    - name: Run Go Tests
      env:
        GO_ENV: testing
        CI: "true"
      run: node tools/run-go-core-gate.mjs --mode test --bin go

    - name: Apply Postgres Integration Schema
      env:
        PGPASSWORD: scriptureforge
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client unzip
        psql -h localhost -p 55433 -U postgres -d scriptureforge -v ON_ERROR_STOP=1 -f migrations/000001_init_extensions.up.sql
        psql -h localhost -p 55433 -U postgres -d scriptureforge -v ON_ERROR_STOP=1 -f migrations/000002_core_schema.up.sql

    - name: Install Staging Evidence PATH Tools
      run: |
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        curl -fsSLo awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        unzip -q awscliv2.zip
        sudo ./aws/install --update
        rm -rf aws awscliv2.zip
        go install golang.org/x/tools/gopls@v0.22.0
        curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        rm kubectl

    - name: Validate CI Project PATH Readiness
      run: node tools/verify-project-path.mjs --ci

    - name: Validate Strict Staging PATH Readiness
      run: node tools/verify-project-path.mjs --ci --strict-staging

    - name: Run Postgres RLS Integration Tests
      env:
        CI: "false"
        GO_ENV: testing
        DATABASE_URL: postgres://postgres:scriptureforge@localhost:55433/scriptureforge?sslmode=disable
        REQUIRE_DATABASE_URL: "true"
        JWT_SECRET_KEY: ci-test-secret-for-scriptureforge-auth-and-rls
      run: go test ./tests/integration ./internal/ports -count=1 -timeout=90s -v

    - name: Run Local Performance Harness Smoke
      run: go run ./tools/loadtest -self-test -duration=2s -concurrency=8 -min-rps=100 -max-p99=200ms

    - name: Run Local WebSocket Performance Harness Smoke
      run: go run ./tools/loadtest -websocket-self-test -concurrency=4 -ws-events-per-client=3 -min-rps=10 -max-p99=500ms

    - name: Test Production Evidence Probes
      run: node tools/run-go-probe-tests.mjs --bin go

    - name: Validate Observability Artifacts
      run: node tools/validate-observability.mjs

    - name: Validate RLS Schema Invariants
      run: node tools/validate-rls-schema.mjs

    - name: Test RLS Schema Validator
      run: node --test tools/validate-rls-schema.test.mjs

    - name: Validate Secret Hygiene
      run: node tools/validate-secret-hygiene.mjs

    - name: Test Secret Hygiene Validator
      run: node --test tools/validate-secret-hygiene.test.mjs

    - name: Validate Deployment Skeleton
      run: node tools/validate-deployment-skeleton.mjs

    - name: Test Deployment Skeleton Validator
      run: node --test tools/validate-deployment-skeleton.test.mjs

    - name: Validate Staging Evidence Manifest
      run: node tools/validate-staging-evidence.mjs

    - name: Validate Staging Evidence Gap Report
      run: node tools/report-staging-evidence-gaps.mjs --manifest production-readiness/staging-evidence.example.json --contract-manifest production-readiness/staging-evidence.example.json --allow-blockers

    - name: Validate CI Workflow Gate Coverage
      run: node tools/validate-ci-workflow.mjs

    - name: Test CI Workflow Gate Coverage
      run: node --test tools/validate-ci-workflow.test.mjs

    - name: Test Local Gate Runner
      run: node --test tools/run-local-gates.test.mjs tools/run-client-command.test.mjs tools/run-go-core-gate.test.mjs tools/run-go-probe-tests.test.mjs tools/run-npm-audit.test.mjs tools/run-terraform-command.test.mjs tools/run-terraform-init.test.mjs tools/run-rls-db-integration.test.mjs tools/run-rls-db-integration-docker.test.mjs tools/validate-local-gate-report.test.mjs tools/validate-ci-workflow.test.mjs tools/validate-ci-evidence-gates.test.mjs tools/validate-deployment-skeleton.test.mjs tools/validate-rls-schema.test.mjs tools/validate-observability.test.mjs tools/validate-dependency-risk.test.mjs tools/validate-security-artifacts.test.mjs tools/validate-secret-hygiene.test.mjs tools/validate-staging-evidence.test.mjs tools/verify-journal-crypto.test.mjs tools/verify-production-readiness.test.mjs tools/record-staging-evidence.test.mjs tools/bootstrap-staging-evidence.test.mjs tools/report-staging-evidence-gaps.test.mjs tools/sync-staging-evidence-contract.test.mjs tools/sync-obsidian-readiness.test.mjs tools/write-ci-release-evidence.test.mjs tools/verify-rust-protobuf.test.mjs tools/verify-project-path.test.mjs

    - name: Validate Serena/Obsidian Sync Drift
      run: node tools/validate-serena-obsidian.mjs

    - name: Validate Staging Evidence Contract Sync
      run: node tools/sync-staging-evidence-contract.mjs --check

    - name: Validate Obsidian Production Readiness Snapshot
      run: node tools/sync-obsidian-readiness.mjs --check

    - name: Test Staging Evidence Validator
      run: node --test tools/validate-staging-evidence.test.mjs

    - name: Test Production Readiness Claim Verifier
      run: node --test tools/verify-production-readiness.test.mjs

    - name: Test Staging Evidence Recorder
      run: node --test tools/record-staging-evidence.test.mjs

    - name: Test Staging Evidence Bootstrap
      run: node --test tools/bootstrap-staging-evidence.test.mjs

    - name: Test Staging Evidence Gap Reporter
      run: node --test tools/report-staging-evidence-gaps.test.mjs

    - name: Test CI Release Evidence Writer
      run: node --test tools/write-ci-release-evidence.test.mjs

    - name: Validate CI Evidence Gate Drift
      run: node tools/validate-ci-evidence-gates.mjs

    - name: Test CI Evidence Gate Drift Validator
      run: node --test tools/validate-ci-evidence-gates.test.mjs

    - name: Validate Security Artifacts
      run: node tools/validate-security-artifacts.mjs

    - name: Validate Dependency Risk Register
      run: node tools/validate-dependency-risk.mjs

    - name: Test Dependency Risk Register Validator
      run: node --test tools/validate-dependency-risk.test.mjs

    - name: Static Security Scan (SAST)
      run: node tools/run-go-core-gate.mjs --mode vet --bin go

    - name: Build Web
      working-directory: web
      run: |
        npm ci
        node ../tools/run-npm-audit.mjs --cwd . --level moderate --bin npm
        npm run smoke
        node ../tools/run-client-command.mjs --cwd . --script typecheck --proof-name web-typecheck-gate --marker web_typescript_no_emit=true --marker web_runtime_types=true --bin npm
        node ../tools/run-client-command.mjs --cwd . --script build --proof-name web-build-gate --marker next_build=true --marker web_production_bundle=true --bin npm

    - name: Check Mobile
      working-directory: mobile
      run: |
        npm ci
        node ../tools/run-npm-audit.mjs --cwd . --level high --bin npm
        npm run smoke
        node ../tools/run-client-command.mjs --cwd . --script build:check --proof-name mobile-build-check-gate --marker mobile_typecheck=true --marker mobile_smoke=true --marker mobile_crypto_verification=true --bin npm

    - name: Validate Rust Protobuf Tooling
      run: node tools/verify-rust-protobuf.mjs

    - name: Test Rust Scripture Engine
      working-directory: services/scripture-engine
      run: cargo test --locked

    - name: Validate Terraform
      run: |
        node tools/run-terraform-command.mjs --mode fmt --bin terraform
        node tools/run-terraform-init.mjs --bin terraform --arg -chdir=build/terraform --arg init --arg -backend=false
        node tools/run-terraform-command.mjs --mode validate --bin terraform

    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    - name: Verify Source Control Clean Before Release Evidence
      run: |
        git diff --quiet
        git diff --cached --quiet
        if [ -n "$(git status --short)" ]; then
          git status --short
          exit 1
        fi

    - name: Write CI Release Evidence
      run: node tools/write-ci-release-evidence.mjs --output artifacts/ci-release-evidence.txt

    - name: Validate CI Release Evidence
      run: go run ./tools/ciprobe -run-artifact-file artifacts/ci-release-evidence.txt -commit-sha "$GITHUB_SHA"

    - name: Upload CI Release Evidence
      uses: actions/upload-artifact@v4
      with:
        name: ci-release-evidence
        path: artifacts/ci-release-evidence.txt
        if-no-files-found: error
