name: Security Pipeline Verification
on:
  push:
    branches: [ "main", "develop", "codex/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Continuous Security Execution
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:eac621400b7b7ff52493883e41e930e3d104695fea5b68cc0c42370cf7880067
        env:
          POSTGRES_PASSWORD: scriptureforge
          POSTGRES_DB: scriptureforge
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scriptureforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (node24)
      with:
        go-version: '1.24.3'

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: |
          web/package-lock.json
          mobile/package-lock.json

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 (node24)

    - name: Run Fuzz Testing Matrix
      run: GO_ENV=testing CI=true go test -fuzz=FuzzSanitizeInput -fuzztime=10s ./tests/unit/

    - name: Run Go Tests
      env:
        GO_ENV: testing
        CI: "true"
      run: node tools/run-go-core-gate.mjs --mode test --bin go

    - name: Apply Postgres Integration Schema
      env:
        PGPASSWORD: scriptureforge
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client unzip
        for migration in migrations/*.up.sql; do
          psql -h localhost -p 55433 -U postgres -d scriptureforge -v ON_ERROR_STOP=1 -f "$migration"
        done

    - name: Install Staging Evidence PATH Tools
      run: |
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        curl -fsSLo awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.27.41.zip
        curl -fsSLo awscliv2.zip.sig https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.27.41.zip.sig
        gpg --batch --import .github/aws-cli-team-public-key.asc
        test "$(gpg --batch --with-colons --fingerprint A6310ACC4672475C | awk -F: '$1 == "fpr" { print $10; exit }')" = "FB5DB77FD5C118B80511ADA8A6310ACC4672475C"
        gpg --batch --verify awscliv2.zip.sig awscliv2.zip
        unzip -q awscliv2.zip
        sudo ./aws/install --update
        rm -rf aws awscliv2.zip awscliv2.zip.sig
        go install golang.org/x/tools/gopls@v0.20.0
        curl -fsSLo kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
        curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl.sha256
        echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check -
        sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
        rm kubectl kubectl.sha256

    - name: Validate CI Project PATH Readiness
      run: node tools/verify-project-path.mjs --ci

    - name: Validate Strict Staging PATH Readiness
      run: node tools/verify-project-path.mjs --ci --strict-staging

    - name: Validate Roadmap Sub-Roadmap Artifacts
      run: node tools/validate-roadmap-artifacts.mjs

    - name: Test Roadmap Sub-Roadmap Validator
      run: node --test tools/validate-roadmap-artifacts.test.mjs

    - name: Run Postgres RLS Integration Tests
      env:
        CI: "false"
        GO_ENV: testing
        DATABASE_URL: postgres://postgres:scriptureforge@localhost:55433/scriptureforge?sslmode=disable
        REQUIRE_DATABASE_URL: "true"
        JWT_SECRET_KEY: ci-test-secret-for-scriptureforge-auth-and-rls
      run: node tools/run-rls-db-integration.mjs --bin go

    - name: Run Local Performance Harness Smoke
      run: go run ./tools/loadtest -self-test -duration=2s -concurrency=8 -min-rps=100 -max-p99=200ms

    - name: Run Local WebSocket Performance Harness Smoke
      run: go run ./tools/loadtest -websocket-self-test -concurrency=4 -ws-events-per-client=3 -min-rps=10 -max-p99=500ms

    - name: Test Production Evidence Probes
      run: node tools/run-go-probe-tests.mjs --bin go

    - name: Validate Observability Artifacts
      run: node tools/validate-observability.mjs

    - name: Validate RLS Schema Invariants
      run: node tools/validate-rls-schema.mjs

    - name: Test RLS Schema Validator
      run: node --test tools/validate-rls-schema.test.mjs

    - name: Validate Secret Hygiene
      run: node tools/validate-secret-hygiene.mjs

    - name: Test Secret Hygiene Validator
      run: node --test tools/validate-secret-hygiene.test.mjs

    - name: Validate Deployment Skeleton
      run: node tools/validate-deployment-skeleton.mjs

    - name: Test Deployment Skeleton Validator
      run: node --test tools/validate-deployment-skeleton.test.mjs

    - name: Validate Disaster Recovery Boundaries
      run: node tools/validate-disaster-recovery.mjs

    - name: Test Disaster Recovery Boundaries
      run: node --test tools/validate-disaster-recovery.test.mjs

    - name: Validate Staging Evidence Manifest
      run: node tools/validate-staging-evidence.mjs

    - name: Validate Staging Evidence Gap Report
      run: node tools/report-staging-evidence-gaps.mjs --manifest production-readiness/staging-evidence.example.json --contract-manifest production-readiness/staging-evidence.example.json --allow-blockers

    - name: Validate CI Workflow Gate Coverage
      run: node tools/validate-ci-workflow.mjs

    - name: Test CI Workflow Gate Coverage
      run: node --test tools/validate-ci-workflow.test.mjs

    - name: Test Local Gate Runner
      run: |
        npm ci --prefix web --ignore-scripts --no-audit --no-fund
        node --test tools/run-local-gates.test.mjs tools/run-client-command.test.mjs tools/run-go-core-gate.test.mjs tools/run-rust-cargo-gate.test.mjs tools/run-go-probe-tests.test.mjs tools/run-npm-audit.test.mjs tools/run-terraform-command.test.mjs tools/run-terraform-init.test.mjs tools/run-rls-db-integration.test.mjs tools/run-rls-db-integration-docker.test.mjs tools/validate-local-gate-report.test.mjs tools/validate-ci-workflow.test.mjs tools/validate-ci-evidence-gates.test.mjs tools/validate-deployment-skeleton.test.mjs tools/validate-disaster-recovery.test.mjs tools/validate-rls-schema.test.mjs tools/validate-observability.test.mjs tools/validate-dependency-risk.test.mjs tools/validate-security-artifacts.test.mjs tools/validate-secret-hygiene.test.mjs tools/validate-staging-evidence.test.mjs tools/verify-journal-crypto.test.mjs tools/verify-production-readiness.test.mjs tools/record-staging-evidence.test.mjs tools/bootstrap-staging-evidence.test.mjs tools/report-staging-evidence-gaps.test.mjs tools/sync-staging-evidence-contract.test.mjs tools/sync-obsidian-readiness.test.mjs tools/write-ci-release-evidence.test.mjs tools/verify-rust-protobuf.test.mjs tools/validate-roadmap-artifacts.test.mjs tools/validate-serena-obsidian.test.mjs tools/verify-project-path.test.mjs tools/verify-mobile-image-size.test.mjs

    - name: Validate Serena/Obsidian Sync Drift
      run: node tools/validate-serena-obsidian.mjs

    - name: Validate Staging Evidence Contract Sync
      run: node tools/sync-staging-evidence-contract.mjs --manifest production-readiness/staging-evidence.example.json --contract-manifest production-readiness/staging-evidence.example.json --check

    - name: Validate Obsidian Production Readiness Snapshot
      run: node tools/sync-obsidian-readiness.mjs --manifest production-readiness/staging-evidence.example.json --contract-manifest production-readiness/staging-evidence.example.json --expected-release-candidate replace-with-git-sha-or-tag --check

    - name: Test Staging Evidence Validator
      run: node --test tools/validate-staging-evidence.test.mjs

    - name: Test Production Readiness Claim Verifier
      run: node --test tools/verify-production-readiness.test.mjs

    - name: Test Staging Evidence Recorder
      run: node --test tools/record-staging-evidence.test.mjs

    - name: Test Staging Evidence Bootstrap
      run: node --test tools/bootstrap-staging-evidence.test.mjs

    - name: Test Staging Evidence Gap Reporter
      run: node --test tools/report-staging-evidence-gaps.test.mjs

    - name: Test CI Release Evidence Writer
      run: node --test tools/write-ci-release-evidence.test.mjs

    - name: Validate CI Evidence Gate Drift
      run: node tools/validate-ci-evidence-gates.mjs

    - name: Test CI Evidence Gate Drift Validator
      run: node --test tools/validate-ci-evidence-gates.test.mjs

    - name: Validate Security Artifacts
      run: node tools/validate-security-artifacts.mjs

    - name: Validate Dependency Risk Register
      run: node tools/validate-dependency-risk.mjs

    - name: Test Dependency Risk Register Validator
      run: node --test tools/validate-dependency-risk.test.mjs

    - name: Static Security Scan (SAST)
      run: node tools/run-go-core-gate.mjs --mode vet --bin go

    - name: Build Web
      working-directory: web
      run: |
        npm ci
        node ../tools/run-npm-audit.mjs --cwd . --level moderate --bin npm
        npm run smoke
        node ../tools/run-client-command.mjs --cwd . --script typecheck --proof-name web-typecheck-gate --marker web_typescript_no_emit=true --marker web_runtime_types=true --bin npm
        node ../tools/run-client-command.mjs --cwd . --script build --proof-name web-build-gate --marker next_build=true --marker web_production_bundle=true --bin npm

    - name: Check Mobile
      working-directory: mobile
      run: |
        npm ci
        node ../tools/run-npm-audit.mjs --cwd . --level high --bin npm
        npm run smoke
        node ../tools/run-client-command.mjs --cwd . --script build:check --proof-name mobile-build-check-gate --marker mobile_typecheck=true --marker mobile_smoke=true --marker mobile_crypto_verification=true --require-output "journal crypto verification passed:" --bin npm

    - name: Validate Rust Protobuf Tooling
      run: node tools/verify-rust-protobuf.mjs

    - name: Test Rust Scripture Engine
      run: node tools/run-rust-cargo-gate.mjs --bin cargo

    - name: Validate Terraform
      run: |
        node tools/run-terraform-command.mjs --mode fmt --bin terraform
        node tools/run-terraform-init.mjs --bin terraform --arg -chdir=build/terraform --arg init --arg -backend=false --arg -lockfile=readonly
        node tools/run-terraform-command.mjs --mode validate --bin terraform

    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@a7082b69f5bc6167bbe27ebab82bf6707f267bf6 # main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    - name: Verify Source Control Clean Before Release Evidence
      run: |
        if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git status --short)" ]; then
          git status --short
          git diff --name-status
          git diff --cached --name-status
          exit 1
        fi

    - name: Write CI Release Evidence
      run: node tools/write-ci-release-evidence.mjs --output artifacts/ci-release-evidence.txt

    - name: Validate CI Release Evidence
      run: go run ./tools/ciprobe -run-artifact-file artifacts/ci-release-evidence.txt -commit-sha "$GITHUB_SHA"

    - name: Upload CI Release Evidence
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
      with:
        name: ci-release-evidence
        path: artifacts/ci-release-evidence.txt
        if-no-files-found: error
